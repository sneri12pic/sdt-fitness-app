name: sdt-fitness-auth-lan

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sdt_fitness_auth}
      POSTGRES_USER: ${POSTGRES_USER:-sdt_auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.lan}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  auth-api:
    build:
      context: ..
      dockerfile: auth-api/Dockerfile
    restart: unless-stopped
    environment:
      AUTH_ENVIRONMENT: lan
      AUTH_HOST: 0.0.0.0
      PORT: 8080
      AUTH_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sdt_fitness_auth}
      AUTH_DATABASE_USER: ${POSTGRES_USER:-sdt_auth}
      AUTH_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.lan}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in deploy/.env.lan}
      AUTH_REFRESH_TOKEN_PEPPER: ${AUTH_REFRESH_TOKEN_PEPPER:?Set AUTH_REFRESH_TOKEN_PEPPER in deploy/.env.lan}
      AUTH_TRUST_PROXY_HEADERS: "false"
      AUTH_BCRYPT_COST: ${AUTH_BCRYPT_COST:-12}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-20}
      AUTH_RATE_LIMIT_WINDOW_MILLIS: ${AUTH_RATE_LIMIT_WINDOW_MILLIS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AUTH_LAN_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
